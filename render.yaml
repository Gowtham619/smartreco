services:
  - type: web
    name: smartreco
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      # Defensive: avoids a known class of SIGILL crash on some virtualized/
      # shared-vCPU cloud hosts where cpuid over-reports AVX-512 support.
      # Harmless to keep even though the vector store no longer relies on any
      # native SIMD extension (see QDRANT_URL below and vector_store.py).
      - key: NPY_DISABLE_CPU_FEATURES
        value: "AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_ICL AVX512_KNL AVX512_KNM"
      - key: MESH_API_KEY
        sync: false
      - key: MESH_BASE_URL
        value: https://api.meshapi.ai/v1
      - key: MESH_CHAT_MODEL
        value: openai/gpt-4o-mini
      - key: MESH_EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: MESH_EMBEDDING_DIM
        value: "1536"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/smartreco.db
      # Required for deployment: Chroma's local mode crashed on Render's CPU
      # (SIGILL inside its native hnswlib extension). Qdrant's local mode is
      # pure Python and would work, but a real Qdrant Cloud instance (free
      # tier) is used instead so vector data also survives redeploys, which
      # Render's ephemeral disk otherwise wouldn't allow. Get a free cluster
      # at cloud.qdrant.io and fill these in — the app falls back to Qdrant's
      # embedded local mode (and an ephemeral disk) if left blank.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@smartreco.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_SEED
        value: "true"
      - key: RECOMMENDATION_EVENT_THRESHOLD
        value: "5"
      - key: RECOMMENDATION_FIRST_EVENT_THRESHOLD
        value: "3"
      - key: RECOMMENDATION_COOLDOWN_MINUTES
        value: "5"
      - key: SCHEDULER_REFRESH_MINUTES
        value: "20"
      - key: DIGEST_HOUR
        value: "17"
      - key: DIGEST_MINUTE
        value: "0"
