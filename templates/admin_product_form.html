{% extends "base.html" %}
{% block title %}{{ "Edit" if product else "New" }} product{% endblock %}
{% block content %}
<h1>{{ "Edit" if product else "New" }} product</h1>
{% if error %}<p class="form-error">{{ error }}</p>{% endif %}
<form class="product-form" method="post" action="{{ '/admin/products/' + product.id|string + '/edit' if product else '/admin/products/new' }}">
  <label>Title
    <input type="text" name="title" value="{{ product.title if product else '' }}" required />
  </label>
  <label>Description
    <textarea name="description" required>{{ product.description if product else '' }}</textarea>
  </label>
  <label>Category
    <input type="text" name="category" value="{{ product.category if product else '' }}" required />
  </label>
  <label>Price (USD)
    <input type="number" step="0.01" min="0" name="price" value="{{ product.price if product else 0 }}" />
  </label>
  <label>Level (optional)
    <input type="text" name="level" value="{{ product.level if product else '' }}" placeholder="Beginner / Intermediate / Advanced" />
  </label>
  <button type="submit" class="btn-primary">{{ "Save changes" if product else "Create product" }}</button>
</form>
{% endblock %}
